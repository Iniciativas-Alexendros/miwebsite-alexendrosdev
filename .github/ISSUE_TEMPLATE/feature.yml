name: Propuesta de mejora
description: Sugiere una funcionalidad o mejora
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema o necesidad
      description: Qué problema resuelve esta propuesta.
    validations:
      required: true
  - type: textarea
    id: solucion
    attributes:
      label: Solución propuesta
      description: Cómo lo abordarías.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
